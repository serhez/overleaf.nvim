name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Luacheck
        uses: lunarmodules/luacheck@v1

      - name: StyLua check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ tests/ plugin/

  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim: [v0.10.4, v0.11.5, stable]
        include:
          - os: ubuntu-latest
            neovim: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install bridge dependencies
        run: npm install --prefix node

      - name: Install Linux ACL test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y acl

      - name: Run Lua, synchronization, and bridge tests
        run: make test
